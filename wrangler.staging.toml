# Dedicated staging API. Never use the development or production database here.
name = "randomtools-api-staging"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["23 3 * * *"]

[vars]
# Replace with the exact stable HTTPS staging frontend origin before deployment.
APP_ORIGIN = "https://staging-origin-not-configured.invalid"
ENVIRONMENT = "staging"
AUTH_PROVIDER = "clerk"
CLERK_ISSUER = "https://quiet-civet-8782.clerk.accounts.dev"
CLERK_PUBLISHABLE_KEY = "pk_test_cXVpZXQtY2l2ZXQtODc4Mi5jbGVyay5hY2NvdW50cy5kZXYk"
PAYMENTS_ENABLED = "false"
# Intentionally fail closed until an approved sender/provider is configured.
EMAIL_PROVIDER = "disabled"

[[d1_databases]]
binding = "DB"
database_name = "randomtools-staging"
database_id = "24d38e43-b765-4d21-b713-fce893d7317d"
migrations_dir = "migrations"
