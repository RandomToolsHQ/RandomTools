name: Validation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -O scripts/firebase-poc-keyless-test.py
      - run: python3 -O scripts/firebase-poc-remote-test.py
      - run: npm run build:firebase-poc
      - run: npx wrangler deploy --config experiments/firebase/wrangler.toml --dry-run
      - run: npm run check:backup
      - run: npm run build:pages
      - run: node scripts/check-seo.mjs
      - run: npx wrangler deploy --config wrangler.api.toml --dry-run
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:firebase-ui
      - run: npm exec --yes --package firebase-tools@15.34.2 -- node scripts/firebase-poc-emulator.mjs
      - run: npm run test:e2e
      - run: npm run build:public-staging
      - run: npm run test:public
      - run: npm run build:staging
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_cXVpZXQtY2l2ZXQtODc4Mi5jbGVyay5hY2NvdW50cy5kZXYk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failure-evidence
          path: test-results/
          retention-days: 1
